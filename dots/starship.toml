"$schema" = 'https://starship.rs/config-schema.json'

format = """
[╭─](color_bg1)\
$os\
$username\
[  ](fg:color_bg1)\
[](fg:color_blue)\
$directory\
$git_branch\
$git_status\
[  ](fg:color_blue)\
[](fg:color_aqua)\
$time\
[ ](fg:color_aqua)\
$line_break$character"""

palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_bg1 = '#121318'
color_blue = '#bac3ff'
color_aqua = '#202a5f'

[os]
disabled = false
style = "bg:color_bg1 fg:color_fg0"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bg:color_bg1 fg:color_fg0"
style_root = "bg:color_bg1 fg:color_fg0"
format = '[ $user ]($style)'

[directory]
style = "fg:color_bg1 bg:color_blue"
format = "[ $path ]($style)"
truncation_length = 1
truncation_symbol = ""

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Code" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol $branch ](fg:color_bg1 bg:color_blue)]($style)'

[git_status]
style = "bg:color_blue"
format = '[[($all_status$ahead_behind )](fg:color_bg1 bg:color_blue)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_aqua"
format = '[[  $time ](fg:color_fg0 bg:color_aqua)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[╰─┃](bold fg:color_bg1)'
error_symbol = '[╰─║](fg:color_bg1)'
